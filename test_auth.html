<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoyagerAI Auth Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .result { margin-top: 20px; padding: 10px; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <div class="container">
        <h1>VoyagerAI Authentication Test</h1>
        
        <h2>Test Login</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" value="test@example.com" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" value="testpass" required>
            </div>
            <button type="submit">Test Login</button>
        </form>
        
        <div id="result"></div>
        
        <h2>Test Signup</h2>
        <form id="signupForm">
            <div class="form-group">
                <label for="signupName">Name:</label>
                <input type="text" id="signupName" value="Test User 2" required>
            </div>
            <div class="form-group">
                <label for="signupEmail">Email:</label>
                <input type="email" id="signupEmail" value="test2@example.com" required>
            </div>
            <div class="form-group">
                <label for="signupPassword">Password:</label>
                <input type="password" id="signupPassword" value="testpass2" required>
            </div>
            <button type="submit">Test Signup</button>
        </form>
        
        <div id="signupResult"></div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:5001';
        
        function showResult(elementId, message, isSuccess = true) {
            const element = document.getElementById(elementId);
            element.innerHTML = `<div class="result ${isSuccess ? 'success' : 'error'}">${message}</div>`;
        }
        
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch(`${API_BASE_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password }),
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showResult('result', `✅ Login successful!<br>User: ${data.user.name}<br>Email: ${data.user.email}<br>Token: ${data.token.substring(0, 50)}...`);
                } else {
                    showResult('result', `❌ Login failed: ${data.message}`, false);
                }
            } catch (error) {
                showResult('result', `❌ Network error: ${error.message}`, false);
            }
        });
        
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('signupName').value;
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            
            try {
                const response = await fetch(`${API_BASE_URL}/api/auth/signup`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ name, email, password }),
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showResult('signupResult', `✅ Signup successful!<br>User: ${data.user.name}<br>Email: ${data.user.email}<br>Token: ${data.token.substring(0, 50)}...`);
                } else {
                    showResult('signupResult', `❌ Signup failed: ${data.message}`, false);
                }
            } catch (error) {
                showResult('signupResult', `❌ Network error: ${error.message}`, false);
            }
        });
    </script>
</body>
</html>
