version: "3.9"

services:
  db:
    image: postgres:16
    container_name: voyagerai_db
    environment:
      POSTGRES_DB: voyagerai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: voyagerai_elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voyagerai_backend
    env_file:
      - ./backend/.env.docker
    environment:
      # override DB + ES hostnames for Docker network
      DATABASE_URL: postgresql://postgres:postgres@db:5432/voyagerai
      ELASTICSEARCH_URL: http://elasticsearch:9200
    depends_on:
      - db
      - elasticsearch
    ports:
      - "5001:5001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: voyagerai_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:5001
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  es_data:
